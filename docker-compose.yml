services:
  scheduler:
    build: .
    command: run_scheduler
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
      RAW_DUMP_DIRECTORY: /data/dumps
    volumes:
      - db-data:/data
    restart: unless-stopped

  # Optional — not required for Phase 0.5, but Django gives it to us
  # almost for free, and it's handy for eyeballing RawContent rows
  # locally while designing the Phase 1 parser. Comment out if unwanted.
  admin:
    build: .
    command: runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
      RAW_DUMP_DIRECTORY: /data/dumps
      DJANGO_DEBUG: "true"
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - scheduler

volumes:
  db-data:
